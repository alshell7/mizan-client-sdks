name: Publish Python SDK

on:
  push:
    branches: [main]
    paths:
      - "mizan-python/pyproject.toml"
      - "mizan-python/src/**"
      - "mizan-python/README.md"
      - "mizan-python/LICENSE"

permissions:
  contents: read

concurrency:
  group: publish-python-pypi
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mizan-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - name: Verify package versions match
        run: python -c "import pathlib,runpy,tomllib; project=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); source=runpy.run_path('src/mizan/_version.py'); assert source['__version__'] == project['project']['version'], 'pyproject.toml and _version.py versions must match'"
      - run: python -m pip install --editable ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m mypy src examples
      - run: python -m build --sdist --wheel
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: mizan-python/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/mizan-billing
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
